<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nap Planner</title>

<style>
body {
  font-family: Arial;
  background:#2b2b2b;
  color:#fff;
  margin:0;
  padding:16px;
}

.container { max-width:1000px; margin:auto; }

.top {
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.pill {
  background:#444;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.section-title {
  text-align:center;
  margin-bottom:10px;
}

.block {
  border-radius:14px;
  padding:14px;
  margin:8px 0;
}

.wake, .bed {
  background:#d9c49c;
  color:#000;
}

.nap {
  background:#9fb3c8;
}

.nap.active { background:#6aa84f; }
.nap.done { background:#4a86e8; }

.awake {
  text-align:center;
  font-size:12px;
  opacity:0.8;
}

.time {
  float:right;
  background:#ddd;
  color:#000;
  padding:4px 8px;
  border-radius:8px;
  cursor:pointer;
}

.duration {
  font-size:12px;
  opacity:0.8;
}
</style>
</head>

<body>
<div class="container">

<div class="top">
  <div class="pill" id="wakeBtn"></div>
  <div class="pill" id="bedBtn"></div>
  <div class="pill" id="napBtn"></div>
  <div class="pill" id="sleepBtn"></div>
  <button id="generate">Generate</button>
</div>

<div class="grid">
  <div>
    <div class="section-title">Desired Schedule</div>
    <div id="ideal"></div>
  </div>

  <div>
    <div class="section-title">Actual Adjusted Schedule</div>
    <div id="actual"></div>
  </div>
</div>

<input type="time" id="hiddenTime" style="opacity:0; position:absolute; pointer-events:none;" step="900">

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const state={
  wake:420,
  bed:1140,
  naps:4,
  daySleep:4,
  ideal:[],
  actual:[]
};

let editingCallback=null;

/* ---------- HELPERS ---------- */
const round15=m=>Math.round(m/15)*15;

function toTime(m){
  let h=Math.floor(m/60)%24;
  let min=m%60;
  let ampm=h>=12?"pm":"am";
  let hh=h%12||12;
  return `${hh}:${min.toString().padStart(2,"0")} ${ampm}`;
}

function fromInput(v){
  let [h,m]=v.split(":").map(Number);
  return round15(h*60+m);
}

function openTimePicker(cb){
  editingCallback=cb;
  const input=document.getElementById("hiddenTime");
  input.value="12:00";
  input.click();
}

document.getElementById("hiddenTime").addEventListener("change",(e)=>{
  if(editingCallback){
    editingCallback(fromInput(e.target.value));
    editingCallback=null;
    render();
  }
});

/* ---------- ENGINE ---------- */
function generate(){
  const awakeTotal=state.bed-state.wake-state.daySleep*60;
  const ww=awakeTotal/(state.naps+1);
  const napLen=(state.daySleep*60)/state.naps;

  let cur=state.wake;
  state.ideal=[];

  for(let i=0;i<state.naps;i++){
    cur+=ww;
    let s=round15(cur);
    let e=round15(s+napLen);
    state.ideal.push({start:s,end:e});
    cur=e;
  }

  state.actual=JSON.parse(JSON.stringify(state.ideal));
}

/* ---------- RENDER ---------- */
function renderTop(){
  wakeBtn.textContent="Wake: "+toTime(state.wake);
  bedBtn.textContent="Bed: "+toTime(state.bed);
  napBtn.textContent="Naps: "+state.naps;
  sleepBtn.textContent="Sleep: "+state.daySleep+"h";
}

function awakeText(prevEnd,nextStart){
  return Math.round((nextStart-prevEnd)/60*100)/100+"h awake";
}

function napLength(n){
  return Math.round((n.end-n.start)/60*100)/100+"h";
}

function renderColumn(container,list,isActual){
  container.innerHTML="";

  const wake=document.createElement("div");
  wake.className="block wake";
  wake.textContent="Wake Up";
  const wt=document.createElement("span");
  wt.className="time";
  wt.textContent=toTime(state.wake);
  wake.appendChild(wt);
  container.appendChild(wake);

  list.forEach((nap,i)=>{

    const awake=document.createElement("div");
    awake.className="awake";
    awake.textContent=i===0 ?
      awakeText(state.wake,nap.start) :
      awakeText(list[i-1].end,nap.start);
    container.appendChild(awake);

    const card=document.createElement("div");
    card.className="block nap";

    if(isActual){
      if(nap.state==="started") card.classList.add("active");
      if(nap.state==="done") card.classList.add("done");
    }

    const t=document.createElement("span");
    t.className="time";
    t.textContent=toTime(nap.start)+" - "+toTime(nap.end);

    const dur=document.createElement("div");
    dur.className="duration";
    dur.textContent=napLength(nap);

    card.append("Nap "+(i+1));
    card.appendChild(t);
    card.appendChild(dur);

    if(isActual){
      t.onclick=(e)=>{
        e.stopPropagation();
        openTimePicker(val=>{
          nap.start=val;
          render();
        });
      };

      card.onclick=()=>{
        if(!nap.state){
          nap.state="started";
          nap.start=round15(new Date().getHours()*60+new Date().getMinutes());
        } else if(nap.state==="started"){
          nap.state="done";
          nap.end=round15(new Date().getHours()*60+new Date().getMinutes());
        } else {
          nap.state=null;
          state.actual[i]=JSON.parse(JSON.stringify(state.ideal[i]));
        }
        render();
      };
    }

    container.appendChild(card);
  });

  const bed=document.createElement("div");
  bed.className="block bed";
  bed.textContent="Bed Time";
  const bt=document.createElement("span");
  bt.className="time";
  bt.textContent=toTime(state.bed);
  bed.appendChild(bt);
  container.appendChild(bed);
}

function render(){
  renderTop();
  renderColumn(ideal,state.ideal,false);
  renderColumn(actual,state.actual,true);
}

/* ---------- EVENTS ---------- */
wakeBtn.onclick=()=>openTimePicker(v=>state.wake=v);
bedBtn.onclick=()=>openTimePicker(v=>state.bed=v);
napBtn.onclick=()=>{
  let v=parseInt(prompt("Naps"));
  if(v){state.naps=v; render();}
};
sleepBtn.onclick=()=>{
  let v=parseFloat(prompt("Day sleep"));
  if(v){state.daySleep=v; render();}
};

generate.onclick=()=>{
  generate();
  render();
};

/* ---------- INIT ---------- */
generate();
render();

});
</script>
</body>
</html>
