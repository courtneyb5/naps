<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nap Planner</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: #fff;
  margin: 0;
  padding: 20px;
}
.container { max-width: 800px; margin: auto; }

.card {
  background: #3a4a5a;
  padding: 15px;
  border-radius: 12px;
  margin: 10px 0;
  cursor: pointer;
  transition: 0.2s;
}
.card.active { background: #6aa84f; }

.controls {
  display: grid;
  gap: 10px;
}

label { font-size: 14px; }

input[type="range"] { width: 100%; }

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #d4b483;
  cursor: pointer;
  font-weight: bold;
}

.time {
  background: #ccc;
  color: #000;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<h2>Nap Planner</h2>

<div class="controls">
  <label>Wake Time: <span id="wakeLabel"></span></label>
  <input id="wake" type="range" min="0" max="1440" step="15">

  <label>Bedtime: <span id="bedLabel"></span></label>
  <input id="bed" type="range" min="0" max="1440" step="15">

  <label>Naps: <span id="napCountLabel"></span></label>
  <input id="napCount" type="range" min="1" max="6">

  <label>Day Sleep (hrs): <span id="daySleepLabel"></span></label>
  <input id="daySleep" type="range" min="1" max="6" step="0.25">

  <button id="generate">Generate Schedule</button>
</div>

<div id="schedule"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  /** SAFE DOM */
  function $(id) {
    return document.getElementById(id);
  }

  const els = {
    wake: $("wake"),
    bed: $("bed"),
    napCount: $("napCount"),
    daySleep: $("daySleep"),
    generate: $("generate"),
    schedule: $("schedule"),
    wakeLabel: $("wakeLabel"),
    bedLabel: $("bedLabel"),
    napCountLabel: $("napCountLabel"),
    daySleepLabel: $("daySleepLabel")
  };

  if (!els.wake || !els.schedule) {
    console.error("DOM not ready");
    return;
  }

  /** FIREBASE INIT */
  const firebaseConfig = {
    apiKey: "AIzaSyCwn2I8pJCngFibXePxcZ3jORVqL8DZkHQ",
    authDomain: "nap-planner-57098.firebaseapp.com",
    databaseURL: "https://nap-planner-57098-default-rtdb.firebaseio.com",
    projectId: "nap-planner-57098",
    storageBucket: "nap-planner-57098.firebasestorage.app",
    messagingSenderId: "945255557653",
    appId: "1:945255557653:web:55725550ef6fe1c3ec7c1c"
  };

  let db = null;

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
  } catch (err) {
    console.warn("Firebase failed safely:", err);
  }

  /** STATE ENGINE */
  const state = {
    wake: 420,
    bed: 1140,
    naps: 4,
    daySleep: 4,
    napData: []
  };

  function minutesToTime(m) {
    const h = Math.floor(m / 60) % 24;
    const min = m % 60;
    const ampm = h >= 12 ? "pm" : "am";
    const hh = h % 12 || 12;
    return `${hh}:${min.toString().padStart(2, "0")} ${ampm}`;
  }

  function timeToMinutes(str) {
    try {
      const [time, mod] = str.trim().toLowerCase().split(" ");
      let [h, m] = time.split(":").map(Number);
      if (mod === "pm" && h !== 12) h += 12;
      if (mod === "am" && h === 12) h = 0;
      return h * 60 + m;
    } catch {
      return 0;
    }
  }

  function generateSchedule() {
    const totalAwake = state.bed - state.wake - state.daySleep * 60;
    if (totalAwake <= 0) return;

    const wakeWindow = totalAwake / (state.naps + 1);
    const napLength = (state.daySleep * 60) / state.naps;

    let current = state.wake;
    state.napData = [];

    for (let i = 0; i < state.naps; i++) {
      current += wakeWindow;

      const start = Math.round(current);
      const end = Math.round(start + napLength);

      state.napData.push({
        start,
        end,
        active: false
      });

      current = end;
    }
  }

  /** UI RENDER */
  function render() {
    els.wakeLabel.textContent = minutesToTime(state.wake);
    els.bedLabel.textContent = minutesToTime(state.bed);
    els.napCountLabel.textContent = state.naps;
    els.daySleepLabel.textContent = state.daySleep + "h";

    els.schedule.innerHTML = "";

    if (!state.napData || state.napData.length === 0) return;

    state.napData.forEach((nap, i) => {
      const card = document.createElement("div");
      card.className = "card" + (nap.active ? " active" : "");

      const startSpan = document.createElement("span");
      startSpan.className = "time";
      startSpan.textContent = minutesToTime(nap.start);

      const endSpan = document.createElement("span");
      endSpan.className = "time";
      endSpan.textContent = minutesToTime(nap.end);

      startSpan.addEventListener("click", (e) => {
        e.stopPropagation();
        const val = prompt("Enter time (e.g. 8:30 am)");
        if (val) {
          const parsed = timeToMinutes(val);
          if (!isNaN(parsed)) nap.start = parsed;
          save();
          render();
        }
      });

      endSpan.addEventListener("click", (e) => {
        e.stopPropagation();
        const val = prompt("Enter time (e.g. 9:30 am)");
        if (val) {
          const parsed = timeToMinutes(val);
          if (!isNaN(parsed)) nap.end = parsed;
          save();
          render();
        }
      });

      card.addEventListener("click", () => {
        nap.active = !nap.active;
        save();
        render();
      });

      card.appendChild(document.createTextNode("Nap " + (i + 1) + " "));
      card.appendChild(startSpan);
      card.appendChild(document.createTextNode(" - "));
      card.appendChild(endSpan);

      els.schedule.appendChild(card);
    });
  }

  /** FIREBASE SYNC */
  function save() {
    if (!db) return;
    db.ref("napPlanner").set(state);
  }

  function load() {
    if (!db) {
      render();
      return;
    }

    db.ref("napPlanner").on("value", (snap) => {
      const data = snap.val();
      if (data && typeof data === "object") {
        Object.assign(state, data);
      }
      render();
    });
  }

  /** EVENTS */
  function bind() {
    els.wake.addEventListener("input", () => {
      state.wake = Number(els.wake.value);
      render(); save();
    });

    els.bed.addEventListener("input", () => {
      state.bed = Number(els.bed.value);
      render(); save();
    });

    els.napCount.addEventListener("input", () => {
      state.naps = Number(els.napCount.value);
      render(); save();
    });

    els.daySleep.addEventListener("input", () => {
      state.daySleep = Number(els.daySleep.value);
      render(); save();
    });

    els.generate.addEventListener("click", () => {
      generateSchedule();
      render();
      save();
    });
  }

  /** INIT */
  function init() {
    els.wake.value = state.wake;
    els.bed.value = state.bed;
    els.napCount.value = state.naps;
    els.daySleep.value = state.daySleep;

    bind();
    generateSchedule();
    render();
    load();
  }

  init();

});
</script>
</body>
</html>
