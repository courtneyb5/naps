<!DOCTYPE html>
<html>
<head>
  <title>Nap Planner</title>
  <style>
    body {
      font-family: Arial;
      background: #2b2b2b;
      color: white;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }

    .label { margin-top: 10px; }

    .timeBtn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #444;
      color: white;
      margin-bottom: 5px;
    }

    .slider { width: 100%; }

    .value { font-size: 14px; margin-bottom: 10px; }

    .card {
      border-radius: 20px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
    }

    .wakeCard { background: #d8c39a; color: black; font-weight: bold; }
    .napCard { background: #9fb3c8; color: black; }
    .napCard.active { background: #6fa8dc; }
    .napCard.done { background: #7fb77e; }

    .line {
      border-left: 2px solid #aaa;
      margin: 10px 20px;
      padding-left: 15px;
      color: #ccc;
    }
  </style>
</head>
<body>

<h2>Nap Planner</h2>

<div class="label">Wake Up</div>
<button class="timeBtn" onclick="pickTime('wake')" id="wakeBtn"></button>
<input type="range" min="300" max="600" step="15" id="wakeSlider" class="slider">

<div class="label">Bedtime</div>
<button class="timeBtn" onclick="pickTime('bed')" id="bedBtn"></button>
<input type="range" min="1020" max="1320" step="15" id="bedSlider" class="slider">

<div class="label">Number of Naps</div>
<input type="range" min="1" max="5" value="4" id="naps" class="slider">
<div class="value" id="napsVal"></div>

<div class="label">Day Sleep (hrs)</div>
<input type="range" min="1" max="6" step="0.25" value="4" id="daySleep" class="slider">
<div class="value" id="sleepVal"></div>

<button onclick="initPlan()">Generate</button>

<div id="output"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwn2I8pJCngFibXePxcZ3jORVqL8DZkHQ",
  authDomain: "nap-planner-57098.firebaseapp.com",
  databaseURL: "https://nap-planner-57098-default-rtdb.firebaseio.com",
  projectId: "nap-planner-57098",
  storageBucket: "nap-planner-57098.firebasestorage.app",
  messagingSenderId: "945255557653",
  appId: "1:945255557653:web:55725550ef6fe1c3ec7c1c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const room = "malakai";

// 👇 MAKE GLOBAL
window.planData = { wake: 420, bed: 1140 };

// ===== HELPERS =====
function nowMin(){
  let d=new Date();
  return d.getHours()*60+d.getMinutes();
}

function toTime(m){
  let h=Math.floor(m/60);
  let min=m%60;
  let ampm = h>=12 ? "pm":"am";
  h = h%12 || 12;
  return `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}

function formatHM(m){
  let h=Math.floor(m/60);
  let min=m%60;
  return `${h}h ${min}m`;
}

function parseTime(t){
  let [h,m]=t.split(":");
  return h*60 + +m;
}

function minToInput(m){
  return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}

// ===== SYNC =====
onValue(ref(db, "plans/" + room), (snapshot) => {
  if (snapshot.exists()) {
    window.planData = snapshot.val();
    updateUI();
    render();
  }
});

function save(){
  set(ref(db, "plans/" + room), window.planData);
}

// ===== INPUTS =====
window.pickTime = function(type){
  let input=document.createElement("input");
  input.type="time";
  input.value=minToInput(planData[type]);

  input.onchange=()=>{
    planData[type]=parseTime(input.value);
    updateUI();
    save();
  };

  input.click();
};

function updateUI(){
  wakeBtn.innerText = toTime(planData.wake);
  bedBtn.innerText = toTime(planData.bed);

  wakeSlider.value = planData.wake;
  bedSlider.value = planData.bed;

  napsVal.innerText = naps.value + " naps";
  sleepVal.innerText = daySleep.value + " hrs";
}

// sliders
wakeSlider.oninput = () => { planData.wake = +wakeSlider.value; updateUI(); save(); };
bedSlider.oninput = () => { planData.bed = +bedSlider.value; updateUI(); save(); };
naps.oninput = () => updateUI();
daySleep.oninput = () => updateUI();

// ===== PLAN =====
window.initPlan = function(){
  planData.naps = +naps.value;
  planData.daySleep = daySleep.value * 60;

  let awake=(planData.bed-planData.wake)-planData.daySleep;
  planData.base=Math.round((awake/(planData.naps+1))/15)*15;

  let weights=[0.35,0.25,0.25,0.15];
  planData.lengths=weights.map(w=>w*planData.daySleep);

  planData.actual=Array(planData.naps).fill(null);

  save();
};

// ===== INTERACTIONS =====
window.tapNap = function(i){
  let nap=planData.actual[i];

  if(!nap){
    planData.actual[i]={start:nowMin()};
  } else if(!nap.end){
    nap.end=nowMin();
  } else {
    planData.actual[i]=null;
  }

  save();
};

window.editTime = function(i,type){
  let nap=planData.actual[i]||{};
  let val=nap[type]||nowMin();

  let input=document.createElement("input");
  input.type="time";
  input.value=minToInput(val);

  input.onchange=()=>{
    if(!planData.actual[i]) planData.actual[i]={};
    planData.actual[i][type]=parseTime(input.value);
    save();
  };

  input.click();
};

// ===== RENDER =====
function render(){
  if(!planData.naps) return;

  let html=`<div class="card wakeCard">
    Wake Up ${toTime(planData.wake)}
  </div>`;

  let current=planData.wake;

  for(let i=0;i<planData.naps;i++){

    html+=`<div class="line">Awake: ${formatHM(planData.base)}</div>`;

    let nap=planData.actual[i];

    let start=nap?.start || current+planData.base;
    let end;

    if(nap?.end){
      end=nap.end;
      current=end;
    } else if(nap?.start){
      end=nowMin();
      current=end;
    } else {
      end=start+planData.lengths[i];
      current=end;
    }

    let duration=end-start;

    html+=`
    <div class="card napCard" onclick="tapNap(${i})">
      <div>
        <b>Nap ${i+1}</b><br>
        ${formatHM(duration)}
      </div>
      <div>
        <span onclick="event.stopPropagation(); editTime(${i},'start')">
          ${toTime(start)}
        </span>
        -
        <span onclick="event.stopPropagation(); editTime(${i},'end')">
          ${toTime(end)}
        </span>
      </div>
    </div>`;
  }

  document.getElementById("output").innerHTML=html;
}

// init
updateUI();

</script>

</body>
</html>
