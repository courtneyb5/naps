<!DOCTYPE html>
<html>
<head>
  <title>Nap Planner</title>
  <style>
    body {
      font-family: Arial;
      background: #2b2b2b;
      color: white;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }

    .label { margin-top: 10px; }

    .timeBtn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #444;
      color: white;
      margin-bottom: 10px;
    }

    .slider { width: 100%; }

    .card {
      border-radius: 20px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
    }

    .wakeCard { background: #d8c39a; color: black; font-weight: bold; }
    .napCard { background: #9fb3c8; color: black; }
    .napCard.active { background: #6fa8dc; }
    .napCard.done { background: #7fb77e; }

    .line {
      border-left: 2px solid #aaa;
      margin: 10px 20px;
      padding-left: 15px;
      color: #ccc;
    }
  </style>
</head>
<body>

<h2>Nap Planner</h2>

<div class="label">Wake Up</div>
<button class="timeBtn" onclick="pickTime('wake')" id="wakeBtn"></button>

<div class="label">Bedtime</div>
<button class="timeBtn" onclick="pickTime('bed')" id="bedBtn"></button>

<div class="label">Number of Naps</div>
<input type="range" min="1" max="5" value="4" id="naps" class="slider">

<div class="label">Day Sleep (hrs)</div>
<input type="range" min="1" max="6" step="0.25" value="4" id="daySleep" class="slider">

<button onclick="initPlan()">Generate</button>

<div id="output"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔥 YOUR CONFIG (already filled)
const firebaseConfig = {
  apiKey: "AIzaSyCwn2I8pJCngFibXePxcZ3jORVqL8DZkHQ",
  authDomain: "nap-planner-57098.firebaseapp.com",
  databaseURL: "https://nap-planner-57098-default-rtdb.firebaseio.com",
  projectId: "nap-planner-57098",
  storageBucket: "nap-planner-57098.firebasestorage.app",
  messagingSenderId: "945255557653",
  appId: "1:945255557653:web:55725550ef6fe1c3ec7c1c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const room = "malakai";

// ===== STATE =====
let planData = {
  wake: 420,
  bed: 1140
};

// ===== HELPERS =====
function nowMin(){
  let d=new Date();
  return d.getHours()*60+d.getMinutes();
}

function toTime(m){
  let h=Math.floor(m/60);
  let min=m%60;
  let ampm = h>=12 ? "pm":"am";
  h = h%12 || 12;
  return `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}

function formatHM(m){
  let h=Math.floor(m/60);
  let min=m%60;
  return `${h}h ${min}m`;
}

function parseTime(t){
  let [h,m]=t.split(":");
  return h*60 + +m;
}

function minToInput(m){
  return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}

// ===== SYNC =====
onValue(ref(db, "plans/" + room), (snapshot) => {
  if (snapshot.exists()) {
    planData = snapshot.val();
    updateButtons();
    render();
  }
});

function save(){
  set(ref(db, "plans/" + room), planData);
}

// ===== INPUTS =====
function pickTime(type){
  let input=document.createElement("input");
  input.type="time";
  input.value=minToInput(planData[type]);

  input.onchange=()=>{
    planData[type]=parseTime(input.value);
    updateButtons();
    save();
  };

  input.click();
}

function updateButtons(){
  wakeBtn.innerText = toTime(planData.wake);
  bedBtn.innerText = toTime(planData.bed);
}

// ===== PLAN =====
function initPlan(){
  planData.naps = +document.getElementById("naps").value;
  planData.daySleep = document.getElementById("daySleep").value * 60;

  let awake=(planData.bed-planData.wake)-planData.daySleep;
  planData.base=Math.round((awake/(planData.naps+1))/15)*15;

  let weights=[0.35,0.25,0.25,0.15];
  planData.lengths=weights.map(w=>w*planData.daySleep);

  planData.actual=Array(planData.naps).fill(null);

  save();
}

// ===== INTERACTIONS =====
function tapNap(i){
  let nap=planData.actual[i];

  if(!nap){
    planData.actual[i]={start:nowMin()};
  } else if(!nap.end){
    nap.end=nowMin();
  } else {
    planData.actual[i]=null;
  }

  save();
}

function editTime(i,type){
  let nap=planData.actual[i]||{};
  let val=nap[type]||nowMin();

  let input=document.createElement("input");
  input.type="time";
  input.value=minToInput(val);

  input.onchange=()=>{
    if(!planData.actual[i]) planData.actual[i]={};
    planData.actual[i][type]=parseTime(input.value);
    save();
  };

  input.click();
}

// ===== RENDER =====
function render(){
  if(!planData.naps) return;

  let html=`<div class="card wakeCard">
    Wake Up ${toTime(planData.wake)}
  </div>`;

  let current=planData.wake;

  for(let i=0;i<planData.naps;i++){

    html+=`<div class="line">Awake: ${formatHM(planData.base)}</div>`;

    let nap=planData.actual[i];

    let start=nap?.start || current+planData.base;
    let end;

    if(nap?.end){
      end=nap.end;
      current=end;
    } else if(nap?.start){
      end=nowMin();
      current=end;
    } else {
      end=start+planData.lengths[i];
      current=end;
    }

    let duration=end-start;

    let stateClass = nap?.end ? "done" : nap?.start ? "active" : "";

    html+=`
    <div class="card napCard ${stateClass}" onclick="tapNap(${i})">

      <div>
        <b>Nap ${i+1}</b><br>
        ${formatHM(duration)}
      </div>

      <div>
        <span onclick="event.stopPropagation(); editTime(${i},'start')">
          ${toTime(start)}
        </span>
        -
        <span onclick="event.stopPropagation(); editTime(${i},'end')">
          ${toTime(end)}
        </span>
      </div>

    </div>`;
  }

  let finalWindow = planData.base + 15;
  let targetBed = planData.bed;
  let suggestedBed = current + finalWindow;

  let minBed = targetBed - 30;
  let maxBed = targetBed + 30;

  if(suggestedBed < minBed) suggestedBed = minBed;
  if(suggestedBed > maxBed) suggestedBed = maxBed;

  html+=`<div class="line">Awake: ${formatHM(finalWindow)}</div>`;

  html+=`
  <div class="card wakeCard">
    Bedtime ${toTime(suggestedBed)}
  </div>`;

  document.getElementById("output").innerHTML=html;
}

// init UI
updateButtons();

</script>

</body>
</html>
