<!DOCTYPE html>
<html>
<head>
  <title>Nap Planner</title>
  <style>
    body {
      font-family: Arial;
      background: #2b2b2b;
      color: white;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #d8c39a;
      font-weight: bold;
    }

    .card {
      border-radius: 20px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wakeCard { background: #d8c39a; color: black; font-weight: bold; }
    .napCard { background: #9fb3c8; color: black; }
    .napCard.active { background: #6fa8dc; }
    .napCard.done { background: #7fb77e; }

    .line {
      border-left: 2px solid #aaa;
      margin: 10px 20px;
      padding-left: 15px;
      font-size: 14px;
      color: #ccc;
    }

    .editBtn {
      font-size: 12px;
      margin-left: 5px;
      padding: 3px 6px;
      border-radius: 6px;
      background: #444;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

<h2>Nap Planner</h2>

<input type="time" id="wake" value="07:00">
<input type="time" id="bed" value="19:00">

<select id="naps">
  <option>1</option><option>2</option><option>3</option>
  <option selected>4</option><option>5</option>
</select>

<input type="number" id="daySleep" step="0.25" value="4">

<button onclick="initPlan()">Generate</button>

<div id="output"></div>

<script>
function nowMin(){
  let d=new Date();
  return d.getHours()*60+d.getMinutes();
}

function toMin(t){let[h,m]=t.split(":").map(Number);return h*60+m;}
function toTime(m){
  let h=Math.floor(m/60);
  let min=m%60;
  let ampm = h>=12 ? "pm":"am";
  h = h%12 || 12;
  return `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}
function minToInput(m){
  let h=Math.floor(m/60);
  let min=m%60;
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}
function round15(x){return Math.round(x/15)*15;}

let planData = {};

function initPlan(){
  let wake=toMin(wakeInput.value);
  let bed=toMin(bedInput.value);
  let naps=parseInt(napsInput.value);
  let daySleep=daySleepInput.value*60;

  let awake=(bed-wake)-daySleep;
  let base=round15(awake/(naps+1));

  let napWeights=[0.35,0.25,0.25,0.15];

  planData = {
    wake,
    bed,
    naps,
    base,
    napLengths: napWeights.map(w=>w*daySleep),
    actual: Array(naps).fill(null)
  };

  render();
}

function tapNap(i){
  let nap = planData.actual[i];

  if(!nap){
    planData.actual[i] = {start: nowMin(), end: null};
  } else if(!nap.end){
    nap.end = nowMin();
  } else {
    planData.actual[i] = null;
  }

  render();
}

function editTime(i, type){
  let nap = planData.actual[i] || {};
  let currentVal = nap[type] || nowMin();

  let input = document.createElement("input");
  input.type = "time";
  input.value = minToInput(currentVal);

  input.onchange = () => {
    let val = toMin(input.value);

    if(!planData.actual[i]) planData.actual[i] = {};

    planData.actual[i][type] = val;

    render();
  };

  input.click();
}

function render(){
  let html = `
    <div class="card wakeCard">
      <div>Wake Up:</div>
      <div>${toTime(planData.wake)}</div>
    </div>
  `;

  let current = planData.wake;

  for(let i=0;i<planData.naps;i++){

    let nap = planData.actual[i];
    let base = planData.base;

    html += `<div class="line">Awake: ${base} mins</div>`;

    let start = nap?.start || current + base;
    let end;

    if(nap?.end){
      end = nap.end;
      current = end;
    } else if(nap?.start){
      end = nowMin();
      current = end;
    } else {
      start = current + base;
      end = start + planData.napLengths[i];
      current = end;
    }

    let stateClass = nap?.end ? "done" : nap?.start ? "active" : "";

    html += `
      <div class="card napCard ${stateClass}" onclick="tapNap(${i})">
        <div><b>Nap ${i+1}</b></div>
        <div>
          ${toTime(start)}
          <button class="editBtn" onclick="event.stopPropagation(); editTime(${i}, 'start')">Edit</button>
          -
          ${toTime(end)}
          <button class="editBtn" onclick="event.stopPropagation(); editTime(${i}, 'end')">Edit</button>
        </div>
      </div>
    `;
  }

  let finalWindow = planData.base + 15;
  let targetBed = planData.bed;
  let suggestedBed = current + finalWindow;

  let minBed = targetBed - 30;
  let maxBed = targetBed + 30;

  if(suggestedBed < minBed) suggestedBed = minBed;
  if(suggestedBed > maxBed) suggestedBed = maxBed;

  html += `<div class="line">Awake: ${finalWindow} mins</div>`;

  html += `
    <div class="card wakeCard">
      <div>Bedtime:</div>
      <div>${toTime(suggestedBed)}</div>
    </div>
  `;

  output.innerHTML = html;
}

const wakeInput=document.getElementById("wake");
const bedInput=document.getElementById("bed");
const napsInput=document.getElementById("naps");
const daySleepInput=document.getElementById("daySleep");
</script>

</body>
</html>
