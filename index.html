<script>

// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
    apiKey: "AIzaSyCwn2I8pJCngFibXePxcZ3jORVqL8DZkHQ",
    authDomain: "nap-planner-57098.firebaseapp.com",
    projectId: "nap-planner-57098",
    storageBucket: "nap-planner-57098.firebasestorage.app",
    messagingSenderId: "945255557653",
    appId: "1:945255557653:web:55725550ef6fe1c3ec7c1c"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔑 shared room (you can change this name)
const room = "malakai";

// ===== EXISTING FUNCTIONS =====

function nowMin(){
  let d=new Date();
  return d.getHours()*60+d.getMinutes();
}

function toTime(m){
  let h=Math.floor(m/60);
  let min=m%60;
  let ampm = h>=12 ? "pm":"am";
  h = h%12 || 12;
  return `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}

function formatHM(m){
  let h=Math.floor(m/60);
  let min=m%60;
  return `${h}h ${min}m`;
}

function parseTime(t){
  let [h,m]=t.split(":");
  return h*60 + +m;
}

// ===== SYNC STATE =====

let planData = {};

// 🔄 LISTEN FOR CHANGES (this is the magic)
db.ref("plans/" + room).on("value", snapshot => {
  if(snapshot.exists()){
    planData = snapshot.val();
    render();
  }
});

// 💾 SAVE
function save(){
  db.ref("plans/" + room).set(planData);
}

// ===== APP LOGIC =====

function initPlan(){
  planData = {
    wake: planData.wake || 420,
    bed: planData.bed || 1140,
    naps: +naps.value,
    daySleep: daySleep.value*60,
    actual: Array(+naps.value).fill(null)
  };

  let awake=(planData.bed-planData.wake)-planData.daySleep;
  planData.base=Math.round((awake/(planData.naps+1))/15)*15;

  let weights=[0.35,0.25,0.25,0.15];
  planData.lengths=weights.map(w=>w*planData.daySleep);

  save();
}

function tapNap(i){
  let nap=planData.actual[i];

  if(!nap){
    planData.actual[i]={start:nowMin()};
  } else if(!nap.end){
    nap.end=nowMin();
  } else {
    planData.actual[i]=null;
  }

  save();
}

function editTime(i,type){
  let nap=planData.actual[i]||{};
  let val=nap[type]||nowMin();

  let input=document.createElement("input");
  input.type="time";
  input.value=`${String(Math.floor(val/60)).padStart(2,'0')}:${String(val%60).padStart(2,'0')}`;

  input.onchange=()=>{
    if(!planData.actual[i]) planData.actual[i]={};
    planData.actual[i][type]=parseTime(input.value);
    save();
  };

  input.click();
}

function render(){
  let html=`<div class="card wakeCard">
    Wake Up ${toTime(planData.wake)}
  </div>`;

  let current=planData.wake;

  for(let i=0;i<planData.naps;i++){

    html+=`<div class="line">Awake: ${formatHM(planData.base)}</div>`;

    let nap=planData.actual[i];

    let start=nap?.start || current+planData.base;
    let end;

    if(nap?.end){
      end=nap.end;
      current=end;
    } else if(nap?.start){
      end=nowMin();
      current=end;
    } else {
      end=start+planData.lengths[i];
      current=end;
    }

    let duration=end-start;

    html+=`
    <div class="card napCard" onclick="tapNap(${i})">

      <div>
        <b>Nap ${i+1}</b><br>
        ${formatHM(duration)}
      </div>

      <div>
        <span onclick="event.stopPropagation(); editTime(${i},'start')">
          ${toTime(start)}
        </span>
        -
        <span onclick="event.stopPropagation(); editTime(${i},'end')">
          ${toTime(end)}
        </span>
      </div>

    </div>`;
  }

  output.innerHTML=html;
}

</script>
