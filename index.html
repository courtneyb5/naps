<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nap Planner</title>

<style>
body { font-family: Arial; background:#1e1e1e; color:#fff; padding:20px; }
.container { max-width:1000px; margin:auto; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

.section { background:#2a2a2a; padding:15px; border-radius:12px; }

.card {
  background:#777;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  cursor:pointer;
}
.card.started { background:#6aa84f; }
.card.done { background:#4a86e8; }

.time {
  background:#ddd;
  color:#000;
  padding:3px 6px;
  border-radius:6px;
  cursor:pointer;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-box {
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:12px;
}

.hidden { display:none; }

.top-controls span { cursor:pointer; background:#ccc; color:#000; padding:3px 6px; border-radius:6px; }
</style>
</head>

<body>
<div class="container">

<div class="top-controls">
Wake: <span id="wakeDisplay"></span>
| Bed: <span id="bedDisplay"></span>
| Naps: <span id="napDisplay"></span>
| Day Sleep: <span id="sleepDisplay"></span>
<br><br>
<button id="generate">Generate</button>
</div>

<div class="grid">
<div class="section">
<h3>Ideal</h3>
<div id="ideal"></div>
</div>

<div class="section">
<h3>Actual</h3>
<div id="actual"></div>
</div>
</div>

</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <input type="time" id="timeInput" step="900">
    <br><br>
    <button id="saveTime">Save</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

/* ---------- STATE ---------- */
const state={
  wake:420,
  bed:1140,
  naps:4,
  daySleep:4,
  ideal:[],
  actual:[]
};

let editingRef=null;

/* ---------- HELPERS ---------- */
const round15 = m => Math.round(m/15)*15;

function toTime(m){
  let h=Math.floor(m/60)%24;
  let min=m%60;
  let ampm=h>=12?"pm":"am";
  let hh=h%12||12;
  return `${hh}:${min.toString().padStart(2,"0")} ${ampm}`;
}

function fromInput(val){
  let [h,m]=val.split(":").map(Number);
  return round15(h*60+m);
}

function nowRounded(){
  const d=new Date();
  return round15(d.getHours()*60+d.getMinutes());
}

/* ---------- ENGINE ---------- */
function generate(){
  const awakeTotal=state.bed-state.wake-state.daySleep*60;
  const ww=awakeTotal/(state.naps+1);
  const napLen=(state.daySleep*60)/state.naps;

  let cur=state.wake;
  state.ideal=[];

  for(let i=0;i<state.naps;i++){
    cur+=ww;
    let start=round15(cur);
    let end=round15(start+napLen);

    state.ideal.push({start,end});
    cur=end;
  }

  state.actual=JSON.parse(JSON.stringify(state.ideal));
}

function adjustFrom(i){
  for(let x=i;x<state.actual.length;x++){
    let prev=state.actual[x-1];
    let idealGap = state.ideal[x].start - state.ideal[x-1].end;

    state.actual[x].start=round15(prev.end+idealGap);
    let len = state.ideal[x].end - state.ideal[x].start;
    state.actual[x].end=round15(state.actual[x].start+len);
  }
}

/* ---------- UI ---------- */
const els={
  ideal:document.getElementById("ideal"),
  actual:document.getElementById("actual"),
  wake:document.getElementById("wakeDisplay"),
  bed:document.getElementById("bedDisplay"),
  naps:document.getElementById("napDisplay"),
  sleep:document.getElementById("sleepDisplay"),
  generate:document.getElementById("generate"),
  modal:document.getElementById("modal"),
  input:document.getElementById("timeInput"),
  saveTime:document.getElementById("saveTime")
};

function renderTop(){
  els.wake.textContent=toTime(state.wake);
  els.bed.textContent=toTime(state.bed);
  els.naps.textContent=state.naps;
  els.sleep.textContent=state.daySleep+"h";
}

function napExtras(i,list){
  let len=list[i].end-list[i].start;
  let wake = i===0 ? list[i].start-state.wake :
    list[i].start-list[i-1].end;

  return ` (${Math.round(len/60*100)/100}h nap, ${Math.round(wake/60*100)/100}h awake)`;
}

function renderList(container,list,isActual){
  container.innerHTML="";

  list.forEach((nap,i)=>{
    const card=document.createElement("div");

    if(isActual){
      if(nap.state==="started") card.className="card started";
      else if(nap.state==="done") card.className="card done";
      else card.className="card";
    } else {
      card.className="card";
    }

    const start=document.createElement("span");
    start.className="time";
    start.textContent=toTime(nap.start);

    const end=document.createElement("span");
    end.className="time";
    end.textContent=toTime(nap.end);

    if(isActual){
      start.onclick=(e)=>{
        e.stopPropagation();
        openModal((val)=>{
          nap.start=val;
          adjustFrom(i);
          render();
        });
      };

      end.onclick=(e)=>{
        e.stopPropagation();
        openModal((val)=>{
          nap.end=val;
          adjustFrom(i+1);
          render();
        });
      };

      card.onclick=()=>{
        if(!nap.state){
          nap.state="started";
          nap.start=nowRounded();
        } else if(nap.state==="started"){
          nap.state="done";
          nap.end=nowRounded();
          adjustFrom(i+1);
        } else {
          nap.state=null;
          state.actual[i]=JSON.parse(JSON.stringify(state.ideal[i]));
        }
        render();
      };
    }

    card.append(`Nap ${i+1} `);
    card.append(start);
    card.append(" - ");
    card.append(end);
    card.append(document.createTextNode(napExtras(i,list)));

    container.appendChild(card);
  });
}

function render(){
  renderTop();
  renderList(els.ideal,state.ideal,false);
  renderList(els.actual,state.actual,true);
}

/* ---------- MODAL ---------- */
function openModal(cb){
  els.modal.classList.remove("hidden");

  els.saveTime.onclick=()=>{
    const val=fromInput(els.input.value);
    els.modal.classList.add("hidden");
    cb(val);
  };
}

/* ---------- EVENTS ---------- */
function bind(){
  els.generate.onclick=()=>{ generate(); render(); };

  els.wake.onclick=()=>{
    openModal(v=>{state.wake=v; render();});
  };

  els.bed.onclick=()=>{
    openModal(v=>{state.bed=v; render();});
  };

  els.naps.onclick=()=>{
    let v=parseInt(prompt("Naps"));
    if(v){state.naps=v; render();}
  };

  els.sleep.onclick=()=>{
    let v=parseFloat(prompt("Day sleep"));
    if(v){state.daySleep=v; render();}
  };
}

/* ---------- INIT ---------- */
bind();
generate();
render();

});
</script>
</body>
</html>V
