<!DOCTYPE html>
<html>
<head>
  <title>Baby Nap Planner</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
    input, select { width: 100%; padding: 8px; margin: 5px 0 15px; }
    button { padding: 10px; width: 100%; }
    .box { border: 1px solid #ddd; padding: 10px; margin-top: 15px; }
  </style>
</head>
<body>

<h2>Nap Planner</h2>

<label>Wake Time</label>
<input type="time" id="wake">

<label>Target Bedtime</label>
<input type="time" id="bed">

<label>Naps</label>
<select id="naps">
  <option>1</option><option>2</option><option>3</option>
  <option selected>4</option><option>5</option>
</select>

<label>Total Day Sleep (hrs)</label>
<input type="number" id="daySleep" step="0.25" value="4">

<button onclick="plan()">Generate Plan</button>

<div class="box" id="planOutput"></div>

<h3>Live Day Tracker</h3>

<label>Last Wake Time</label>
<input type="time" id="actualWake">

<label>Last Nap End</label>
<input type="time" id="lastNapEnd">

<button onclick="recalculate()">Recalculate Remaining Day</button>

<div class="box" id="liveOutput"></div>

<script>
function toMin(t){let[h,m]=t.split(":").map(Number);return h*60+m;}
function toTime(m){
  m = Math.round(m);
  let h=Math.floor(m/60),min=m%60;
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}
function round15(x){return Math.round(x/15)*15;}

let savedPlan = {};

function plan(){
  let wake=toMin(wakeInput.value);
  let bed=toMin(bedInput.value);
  let naps=parseInt(napsInput.value);
  let daySleep=daySleepInput.value*60;

  let awake=(bed-wake)-daySleep;
  let windows=naps+1;

  let base=round15(awake/windows);

  let napLengths=[];
  if(naps>=3){
    napLengths=[0.35,0.25,0.25,0.15]; // weighted
  } else {
    napLengths=Array(naps).fill(1/naps);
  }

  let times=[];
  let current=wake;

  for(let i=0;i<naps;i++){
    current+=base;
    let napStart=current;

    let napLen=daySleep*(napLengths[i]||1/naps);
    current+=napLen;

    times.push(`Nap ${i+1}: ${toTime(napStart)} - ${toTime(current)}`);
  }

  // longer final window
  current += 15;

  times.push(`Target Bedtime: ${toTime(bed)}`);

  savedPlan={wake,bed,base,naps,daySleep};

  planOutput.innerHTML=times.join("<br>");
}

function recalculate(){
  if(!savedPlan.wake){return;}

  let lastNapEnd=toMin(lastNapEndInput.value);
  let targetBed=savedPlan.bed;

  let finalWindow=savedPlan.base + 15;

  let newBed=lastNapEnd + finalWindow;

  // clamp ±30 mins
  let minBed=targetBed-30;
  let maxBed=targetBed+30;

  if(newBed<minBed) newBed=minBed;
  if(newBed>maxBed) newBed=maxBed;

  liveOutput.innerHTML=`
    Suggested Bedtime: ${toTime(newBed)}<br>
    (Adjusted from ${toTime(targetBed)})
  `;
}

// inputs shortcut
const wakeInput=document.getElementById("wake");
const bedInput=document.getElementById("bed");
const napsInput=document.getElementById("naps");
const daySleepInput=document.getElementById("daySleep");
const lastNapEndInput=document.getElementById("lastNapEnd");
</script>

</body>
</html>
