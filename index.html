<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nap Planner</title>

<style>
body { font-family: Arial; background:#2b2b2b; color:#fff; padding:16px; }

.container { max-width:1000px; margin:auto; }

.controls { margin-bottom:20px; }
label { font-size:14px; }

input[type=range] { width:100%; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

.block { border-radius:14px; padding:14px; margin:8px 0; }

.wake,.bed { background:#d9c49c; color:#000; }
.nap { background:#9fb3c8; }
.nap.started { background:#6aa84f; }
.nap.done { background:#4a86e8; }

.time {
  float:right;
  background:#ddd;
  color:#000;
  padding:4px 8px;
  border-radius:8px;
  cursor:pointer;
}

.awake { text-align:center; font-size:12px; opacity:0.8; }
.duration { font-size:12px; opacity:0.8; }

.section-title { text-align:center; margin-bottom:10px; }
</style>
</head>

<body>
<div class="container">

<div class="controls">
<label>Wake: <span id="wakeLabel"></span></label>
<input id="wake" type="range" min="300" max="540" step="15">

<label>Bed: <span id="bedLabel"></span></label>
<input id="bed" type="range" min="1080" max="1260" step="15">

<label>Naps: <span id="napLabel"></span></label>
<input id="naps" type="range" min="1" max="5">

<label>Day Sleep: <span id="sleepLabel"></span></label>
<input id="sleep" type="range" min="1" max="5" step="0.5">

<button id="generate">Generate</button>
</div>

<div class="grid">
<div>
<div class="section-title">Desired</div>
<div id="ideal"></div>
</div>

<div>
<div class="section-title">Actual</div>
<div id="actual"></div>
</div>
</div>

<input type="time" id="timePicker" style="opacity:0; position:absolute;" step="900">

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const state={
  wake:420,
  bed:1140,
  naps:3,
  daySleep:3,
  ideal:[],
  actual:[]
};

let timeCallback=null;

/* ---------- HELPERS ---------- */
const round15=m=>Math.round(m/15)*15;

function toTime(m){
  let h=Math.floor(m/60)%24;
  let min=m%60;
  let ampm=h>=12?"pm":"am";
  let hh=h%12||12;
  return `${hh}:${min.toString().padStart(2,"0")} ${ampm}`;
}

function openTime(cb){
  timeCallback=cb;
  const el=document.getElementById("timePicker");
  el.value="12:00";
  el.click();
}

document.getElementById("timePicker").addEventListener("change",e=>{
  if(timeCallback){
    let [h,m]=e.target.value.split(":").map(Number);
    timeCallback(round15(h*60+m));
    timeCallback=null;
    render();
  }
});

/* ---------- ENGINE ---------- */
function generate(){
  const awakeTotal=state.bed-state.wake-state.daySleep*60;
  if(awakeTotal<=0) return;

  const ww=awakeTotal/(state.naps+1);
  const napLen=(state.daySleep*60)/state.naps;

  let cur=state.wake;
  state.ideal=[];

  for(let i=0;i<state.naps;i++){
    cur+=ww;
    let s=round15(cur);
    let e=round15(s+napLen);
    state.ideal.push({start:s,end:e});
    cur=e;
  }

  state.actual=JSON.parse(JSON.stringify(state.ideal));
}

/* ---------- RENDER ---------- */
const els={
  ideal:document.getElementById("ideal"),
  actual:document.getElementById("actual"),
  wake:document.getElementById("wake"),
  bed:document.getElementById("bed"),
  naps:document.getElementById("naps"),
  sleep:document.getElementById("sleep"),
  wakeLabel:document.getElementById("wakeLabel"),
  bedLabel:document.getElementById("bedLabel"),
  napLabel:document.getElementById("napLabel"),
  sleepLabel:document.getElementById("sleepLabel")
};

function renderTop(){
  els.wakeLabel.textContent=toTime(state.wake);
  els.bedLabel.textContent=toTime(state.bed);
  els.napLabel.textContent=state.naps;
  els.sleepLabel.textContent=state.daySleep+"h";

  els.wake.value=state.wake;
  els.bed.value=state.bed;
  els.naps.value=state.naps;
  els.sleep.value=state.daySleep;
}

function renderColumn(container,list,isActual){
  container.innerHTML="";

  /* --- WAKE BLOCK (FIXED) --- */
  const wake=document.createElement("div");
  wake.className="block wake";

  const wakeTime=document.createElement("span");
  wakeTime.className="time";
  wakeTime.textContent=toTime(state.wake);

  if(isActual){
    wakeTime.onclick=(e)=>{
      e.stopPropagation();
      openTime(val=>{
        state.wake=val;
        render();
      });
    };
  }

  wake.append("Wake Up");
  wake.appendChild(wakeTime);
  container.appendChild(wake);

  list.forEach((nap,i)=>{

    const awake=document.createElement("div");
    awake.className="awake";

    const prevEnd=i===0?state.wake:list[i-1].end;
    awake.textContent=((nap.start-prevEnd)/60).toFixed(2)+"h awake";
    container.appendChild(awake);

    const card=document.createElement("div");
    card.className="block nap";

    if(isActual){
      if(nap.state==="started") card.classList.add("started");
      if(nap.state==="done") card.classList.add("done");
    }

    const start=document.createElement("span");
    start.className="time";
    start.textContent=toTime(nap.start);

    const end=document.createElement("span");
    end.className="time";
    end.textContent=toTime(nap.end);

    const dur=document.createElement("div");
    dur.className="duration";
    dur.textContent=((nap.end-nap.start)/60).toFixed(2)+"h";

    if(isActual){
      start.onclick=(e)=>{
        e.stopPropagation();
        openTime(val=>{
          nap.start=val;
          render();
        });
      };

      end.onclick=(e)=>{
        e.stopPropagation();
        openTime(val=>{
          nap.end=val;
          render();
        });
      };

      card.onclick=()=>{
        if(!nap.state){
          nap.state="started";
          nap.start=round15(new Date().getHours()*60+new Date().getMinutes());
        } else if(nap.state==="started"){
          nap.state="done";
          nap.end=round15(new Date().getHours()*60+new Date().getMinutes());
        } else {
          nap.state=null;
          state.actual[i]=JSON.parse(JSON.stringify(state.ideal[i]));
        }
        render();
      };
    }

    card.append(`Nap ${i+1}`);
    card.appendChild(start);
    card.append(" - ");
    card.appendChild(end);
    card.appendChild(dur);

    container.appendChild(card);
  });

  /* --- BED BLOCK (FIXED) --- */
  const bed=document.createElement("div");
  bed.className="block bed";

  const bedTime=document.createElement("span");
  bedTime.className="time";
  bedTime.textContent=toTime(state.bed);

  if(isActual){
    bedTime.onclick=(e)=>{
      e.stopPropagation();
      openTime(val=>{
        state.bed=val;
        render();
      });
    };
  }

  bed.append("Bed Time");
  bed.appendChild(bedTime);
  container.appendChild(bed);
}

    /* FIXED CLICK HANDLING */
    if(isActual){
      start.onclick=(e)=>{
        e.stopPropagation();
        openTime(val=>{
          nap.start=val;
          render();
        });
      };

      end.onclick=(e)=>{
        e.stopPropagation();
        openTime(val=>{
          nap.end=val;
          render();
        });
      };

      card.onclick=()=>{
        if(!nap.state){
          nap.state="started";
          nap.start=round15(new Date().getHours()*60+new Date().getMinutes());
        } else if(nap.state==="started"){
          nap.state="done";
          nap.end=round15(new Date().getHours()*60+new Date().getMinutes());
        } else {
          nap.state=null;
          state.actual[i]=JSON.parse(JSON.stringify(state.ideal[i]));
        }
        render();
      };
    }

    card.append(`Nap ${i+1}`);
    card.appendChild(start);
    card.append(" - ");
    card.appendChild(end);
    card.appendChild(dur);

    container.appendChild(card);
  });
}

function render(){
  renderTop();
  renderColumn(els.ideal,state.ideal,false);
  renderColumn(els.actual,state.actual,true);
}

/* ---------- EVENTS ---------- */
els.wake.oninput=()=>{ state.wake=+els.wake.value; render(); };
els.bed.oninput=()=>{ state.bed=+els.bed.value; render(); };
els.naps.oninput=()=>{ state.naps=+els.naps.value; render(); };
els.sleep.oninput=()=>{ state.daySleep=+els.sleep.value; render(); };

generate.onclick=()=>{
  generate();
  render();
};

/* ---------- INIT ---------- */
generate();
render();

});
</script>
</body>
</html>
